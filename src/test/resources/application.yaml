spring:
  datasource:
    url: jdbc:h2:mem:cyphertest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  # Jackson 3 (Spring Boot 4): WRITE_DATES_AS_TIMESTAMPS saiu de SerializationFeature
  # e vive em DateTimeFeature, exposto sob spring.jackson.datatype.datetime.
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

  ai:
    mcp:
      server:
        name: cypher-mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        type: SYNC

cypher:
  llm:
    provider: claude
    prompt-version: v2
    timeout-seconds: 20
    max-tokens: 1024
    claude:
      api-key: chave-de-teste
      model: claude-teste
      base-url: http://127.0.0.1:0
    gemini:
      api-key: chave-de-teste
      model: gemini-teste
      base-url: http://127.0.0.1:0
  catalog:
    stations: []
    cameras: []
  cors:
    allowed-origins:
      - http://localhost:4200
